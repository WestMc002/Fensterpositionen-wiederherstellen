# Fensterpositionen wiederherstellen - automatische Bereitstellung der EXE
# Baut "Fensterpositionen wiederherstellen.exe" mit csc aus .NET Framework 4 (wie Erstellen.bat),
# packt sie mit Anleitung.txt als ZIP (GitHub ersetzt Leerzeichen in Dateinamen von Release-Anhängen
# durch Punkte, im ZIP bleibt der Originalname erhalten) und legt das Release v<Version> an.
# Release-Seite: oben "Änderungen" (Zeilen mit "- " aus dem neuesten Commit, dessen Text die
# Versionsnummer nennt), darunter die Installation.
# Gibt es das Release zur Version schon, wird nichts neu gebaut; nur der Release-Text wird aufgefrischt.
# Auslöser: "Run workflow" mit Versionsnummer oder Änderung dieser Datei auf main
# (dann gilt die Version aus dem neuesten Commit-Text "Fensterpositionen wiederherstellen <Version>").

name: Release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. 2.22.2026.1101'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # ganze Historie, um den Commit zur Version zu finden

      - name: Version bestimmen
        id: ver
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          $ver = '${{ github.event.inputs.version }}'
          if(-not $ver) {
            $text = (git log --format=%B -n 200) -join "`n"
            if($text -match 'Fensterpositionen wiederherstellen v?(\d+\.\d+\.\d{4}\.\d{4})') { $ver = $Matches[1] }
          }
          $ver = "$ver".TrimStart('v')
          if($ver -notmatch '^\d+\.\d+\.\d{4}\.\d{4}$') { throw "Ungültige Version: $ver" }
          "version=$ver" >> $env:GITHUB_OUTPUT
          gh release view "v$ver" *> $null
          if($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT; Write-Host "Release v$ver existiert bereits - nur der Text wird aufgefrischt." }
          else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Kompilieren
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          @(
            "[assembly: System.Reflection.AssemblyVersion(""$ver"")]"
            "[assembly: System.Reflection.AssemblyFileVersion(""$ver"")]"
            "[assembly: System.Reflection.AssemblyInformationalVersion(""$ver"")]"
            "namespace Fensterpositionen { public static partial class AppInfo { public const string Version = ""$ver""; } }"
          ) | Set-Content -Path 'Quellcode\VersionInfo.cs' -Encoding utf8
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if(-not (Test-Path $csc)) { $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          & $csc /nologo /target:winexe /optimize+ /codepage:65001 "/out:Fensterpositionen wiederherstellen.exe" `
            "/win32icon:Resources\Fensterpositionen.ico" `
            "/resource:Resources\Fensterpositionen.ico,Fensterpositionen.ico" `
            "/resource:Resources\GS-Logo.png,GS-Logo.png" `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll `
            /r:System.Web.Extensions.dll /r:System.ServiceProcess.dll Quellcode\*.cs
          if($LASTEXITCODE -ne 0) { throw 'Kompilieren fehlgeschlagen' }
          (Get-Item 'Fensterpositionen wiederherstellen.exe').VersionInfo.FileVersion

      - name: ZIP packen
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Path 'paket' | Out-Null
          Copy-Item 'Fensterpositionen wiederherstellen.exe', 'Anleitung.txt' -Destination 'paket'
          Compress-Archive -Path 'paket\*' -DestinationPath "Fensterpositionen-wiederherstellen-$ver.zip"

      - name: Release-Text erstellen
        shell: pwsh
        run: |
          # "Änderungen" = Zeilen mit "- " aus dem neuesten Commit, dessen Text die Version nennt,
          # sonst aus dem letzten Commit; darunter die Installation
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          $ver = '${{ steps.ver.outputs.version }}'
          $sha = git log --format=%H -F --grep="$ver" -n 1
          if(-not $sha) { $sha = git rev-parse HEAD }
          $body = git log -1 --format=%b $sha
          $items = @($body -split "`r?`n" | Where-Object { $_ -match '^\s*[-*] ' } | ForEach-Object { '- ' + ($_.Trim() -replace '^[-*]\s+', '') })
          if($items.Count -eq 0) { $items = @('- siehe Anleitung.txt') }
          $lines = @('## Änderungen', '') + $items + @(
            '',
            '## Installation',
            '',
            "1. ``Fensterpositionen-wiederherstellen-$ver.zip`` herunterladen und in einen eigenen Ordner entpacken, z. B. ``C:\Tools\Fensterpositionen wiederherstellen``.",
            '2. `Fensterpositionen wiederherstellen.exe` per Doppelklick starten.',
            '3. Fenster anordnen, Programme anhaken und „Positionen speichern“ anklicken; weitere Programme über „Programm hinzufügen“ aufnehmen.',
            '',
            'Voraussetzung: Windows 10/11 mit .NET Framework 4 (in Windows enthalten). Gespeicherte Positionen, Sicherungen und Protokolle liegen unter `%LOCALAPPDATA%\Fensterpositionen wiederherstellen`; bei einem Update nur die EXE ersetzen. Ausführliche Beschreibung und Versionsgeschichte: `Anleitung.txt` im ZIP.'
          )
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllLines((Join-Path $PWD 'release-notes.md'), [string[]]$lines, $utf8)
          Get-Content 'release-notes.md'

      - name: Release anlegen
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          gh release create "v$ver" "Fensterpositionen-wiederherstellen-$ver.zip" --title "Fensterpositionen wiederherstellen $ver" --notes-file release-notes.md --target $env:GITHUB_SHA

      - name: Release-Text auffrischen
        if: steps.ver.outputs.exists == 'true'
        shell: pwsh
        run: gh release edit "v${{ steps.ver.outputs.version }}" --notes-file release-notes.md
